name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test (macOS Apple Silicon)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies via Homebrew
        run: |
          brew install libtorrent-rasterbar boost openssl@4

      - name: Build (Release)
        run: |
          swift build -c release

      - name: Run Test Suite
        run: |
          ./build.sh test

      - name: Build Application Bundle
        run: |
          ./build.sh release

      - name: Verify Bundle Integrity & Signature
        run: |
          codesign --verify --deep --strict dist/Vertex.app
          otool -L dist/Vertex.app/Contents/MacOS/Vertex

      - name: Create DMG Disk Image
        run: |
          ./Scripts/make-dmg.sh --no-build

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vertex-macOS14-arm64-dmg
          path: |
            dist/*.dmg
            dist/*.sha256

      - name: Attach DMG to GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG trovata. Caricamento DMG compilata su macOS 14..."
            gh release upload "$TAG" dist/Vertex-${VERSION}-macOS14.0-arm64.dmg* --clobber
          else
            echo "Release $TAG non ancora creata. Skip upload."
          fi
