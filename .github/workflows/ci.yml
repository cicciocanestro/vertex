name: CI

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test & Package (macOS 15, arm64)
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify arm64 runner
        run: test "$(uname -m)" = arm64

      - name: Ensure CMake is available
        run: |
          if ! command -v cmake >/dev/null 2>&1; then
            brew install cmake
          fi
          cmake --version

      - name: Cache pinned engine dependencies
        uses: actions/cache@v4
        with:
          path: .build/vertex-deps
          key: vertex-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Scripts/deps.env', 'Scripts/build-deps.sh') }}
          restore-keys: |
            vertex-deps-${{ runner.os }}-${{ runner.arch }}-

      - name: Build pinned engine dependencies
        run: ./Scripts/build-deps.sh

      - name: Run test suite
        run: ./build.sh test

      - name: Build application bundle
        run: ./build.sh release

      - name: Verify self-contained bundle
        run: ./Scripts/verify-bundle.sh dist/Vertex.app 15.0 arm64

      - name: Create DMG and checksum
        run: ./Scripts/make-dmg.sh --no-build

      - name: Verify DMG checksum
        run: |
          cd dist
          shasum -a 256 -c Vertex-*.dmg.sha256

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          test "v${VERSION}" = "${GITHUB_REF_NAME}" || {
            echo "Il tag ${GITHUB_REF_NAME} non corrisponde alla versione ${VERSION}"
            exit 1
          }

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vertex-${{ github.sha }}
          path: |
            dist/Vertex-*.dmg
            dist/Vertex-*.dmg.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified artifact
        uses: actions/download-artifact@v4
        with:
          name: Vertex-${{ github.sha }}
          path: dist

      - name: Verify downloaded checksum
        run: |
          cd dist
          shasum -a 256 -c Vertex-*.dmg.sha256

      - name: Create GitHub Release (no asset overwrite)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/Vertex-*.dmg \
            dist/Vertex-*.dmg.sha256 \
            --title "Vertex ${GITHUB_REF_NAME#v}" \
            --generate-notes
