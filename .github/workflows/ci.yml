name: CI

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test & Package (macOS 15, arm64)
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      # Tagged builds are the canonical release builds and must use the exact
      # toolchain recorded in Scripts/toolchain.env. Branches may use a newer
      # runner image for development; the mismatch is reported but not fatal.
      VERTEX_CANONICAL: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify runner architecture
        run: |
          source Scripts/app.env
          test "$(uname -m)" = "$VERTEX_ARCH"

      - name: Select canonical Xcode
        run: |
          source Scripts/toolchain.env
          if [ -d "$VERTEX_CANONICAL_XCODE_PATH" ]; then
            sudo xcode-select --switch "$VERTEX_CANONICAL_XCODE_PATH"
            echo "DEVELOPER_DIR=$VERTEX_CANONICAL_XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"
            xcodebuild -version
          elif [ "${VERTEX_CANONICAL}" = "1" ]; then
            echo "::error::Xcode canonico non trovato: $VERTEX_CANONICAL_XCODE_PATH" >&2
            exit 1
          else
            echo "::warning::Xcode canonico non trovato; build di sviluppo non canonica"
          fi

      - name: Verify canonical toolchain
        run: |
          if [ "${VERTEX_CANONICAL}" = "1" ]; then
            ./Scripts/check-toolchain.sh --strict
          else
            ./Scripts/check-toolchain.sh --warn
          fi

      - name: Verify localization parity
        run: ./Scripts/check-localization.sh

      - name: Cache pinned engine dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/vertex-deps
          key: vertex-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Scripts/deps.env', 'Scripts/build-deps.sh', 'Scripts/toolchain.env') }}
          restore-keys: |
            vertex-deps-${{ runner.os }}-${{ runner.arch }}-

      - name: Build pinned engine dependencies
        run: ./Scripts/build-deps.sh

      - name: Run test suite
        env:
          # Enables the best-effort UPnP/NAT-PMP smoke test. Local test runs
          # never touch the user's router because the gate stays closed.
          VERTEX_TEST_UPNP: "1"
        run: ./build.sh test

      - name: Verify test artifacts
        run: |
          test -s dist/test-results.xml
          test -s dist/coverage/coverage.txt
          test -s dist/coverage/coverage.lcov

      - name: Upload test report and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Vertex-tests-${{ github.sha }}
          path: |
            dist/test-results.xml
            dist/coverage/
          if-no-files-found: warn

      - name: Build application bundle
        run: ./build.sh release

      - name: Verify self-contained bundle
        run: |
          source Scripts/app.env
          ./Scripts/verify-bundle.sh "dist/${VERTEX_APP_NAME}.app"

      - name: Create DMG and checksum
        run: ./Scripts/make-dmg.sh --no-build

      - name: Verify DMG checksum
        run: |
          source Scripts/app.env
          cd dist
          shasum -a 256 -c "${VERTEX_APP_NAME}-"*.dmg.sha256

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          test "v${VERSION}" = "${GITHUB_REF_NAME}" || {
            echo "Il tag ${GITHUB_REF_NAME} non corrisponde alla versione ${VERSION}"
            exit 1
          }

      - name: Upload release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Vertex-${{ github.sha }}
          path: |
            dist/Vertex-*.dmg
            dist/Vertex-*.dmg.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download verified artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Vertex-${{ github.sha }}
          path: dist

      - name: Verify downloaded checksum
        run: |
          cd dist
          shasum -a 256 -c Vertex-*.dmg.sha256

      - name: Create GitHub Release (no asset overwrite)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/Vertex-*.dmg \
            dist/Vertex-*.dmg.sha256 \
            --title "Vertex ${GITHUB_REF_NAME#v}" \
            --generate-notes
